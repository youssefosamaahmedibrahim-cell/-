<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="description" content="نموذج ثلاثي الأبعاد للمتجر السري — استكشف تفاصيل المتجر من كل الزوايا." />
    <title>SECRET SHOP — نموذج المتجر</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app" aria-label="عارض نموذج المتجر ثلاثي الأبعاد">
      <canvas id="scene" aria-label="نموذج ثلاثي الأبعاد للمتجر، اسحب لتدويره" tabindex="0"></canvas>
    </main>

    <div id="loader" role="status">
      <div class="loading-mark" aria-hidden="true">
        <svg viewBox="0 0 48 40"><path d="M5 31 9 9l9 12L24 4l6 17L39 9l4 22H5Z"/><path d="M8 35h32"/></svg>
      </div>
      <span>جارٍ تجهيز النموذج</span>
      <div class="loading-line"><i></i></div>
    </div>

    <header class="topbar hud">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 40"><path d="M5 31 9 9l9 12L24 4l6 17L39 9l4 22H5Z"/><path d="M8 35h32"/></svg>
        </div>
        <div>
          <h1 dir="ltr">SECRET <span>SHOP</span></h1>
          <p>نموذج المتجر ثلاثي الأبعاد</p>
        </div>
      </div>
      <div class="model-label" dir="ltr"><span class="status-dot"></span> 3D MODEL <i></i> <span>01 / 01</span></div>
    </header>

    <div class="viewer-meta hud" aria-hidden="true">
      <span>THE SECRET SHOP</span>
      <i></i>
      <span>نموذج تفاعلي</span>
    </div>

    <section class="controls hud" aria-label="التحكم في النموذج">
      <div class="controls-inner">
        <div class="view-select" role="group" aria-label="زوايا العرض">
          <span class="control-label">زاوية العرض</span>
          <div class="views" id="viewChips">
            <button class="view-btn is-active" type="button" data-view="hero" aria-pressed="true">الواجهة</button>
            <button class="view-btn" type="button" data-view="side" aria-pressed="false">جانبي</button>
            <button class="view-btn" type="button" data-view="roof" aria-pressed="false">السقف</button>
            <button class="view-btn" type="button" data-view="inside" aria-pressed="false">الداخل</button>
            <button class="view-btn" type="button" data-view="top" aria-pressed="false">من الأعلى</button>
          </div>
        </div>
        <div class="control-divider" aria-hidden="true"></div>
        <div class="tools" role="group" aria-label="أدوات العرض">
          <button class="tool-btn" id="btnReset" type="button" aria-label="إعادة الزاوية" title="إعادة الزاوية">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button class="tool-btn" id="btnSpin" type="button" aria-label="تشغيل الدوران التلقائي" aria-pressed="false" title="الدوران التلقائي">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c0-2.5 4-4.5 9-4.5s9 2 9 4.5-4 4.5-9 4.5"/><path d="m8 14-3 2.5 3 2.5"/></svg>
          </button>
          <button class="tool-btn" id="btnFull" type="button" aria-label="ملء الشاشة" title="ملء الشاشة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
          <button class="download-btn" id="btnDownload" type="button" title="حفظ النموذج بخلفية شفافة">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3h16v-3"/></svg>
            <span>حفظ PNG</span>
          </button>
        </div>
      </div>
      <p class="hint" id="hint"><span class="hint-icon" aria-hidden="true">✥</span> اسحب لتدوير النموذج <span class="hint-sep">/</span> عجلة الماوس للتقريب</p>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
